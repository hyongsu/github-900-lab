site_name: GitHub 기초 실습 가이드 (GH-900)
site_description: GitHub 기초 과정 교안과 실습 가이드
site_author: 스킬잇 김누리
site_url: https://skilleat-labs.github.io/github-900-lab/
repo_url: https://github.com/skilleat-labs/github-900-lab
repo_name: skilleat-labs/github-900-lab
edit_uri: ""

theme:
  name: material
  language: ko
  font:
    text: Noto Sans KR
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: 라이트 모드로 전환
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

nav:
  - 홈: index.md
  - 시작 전 준비:
      - 1. GitHub 계정과 로그인: setup/1-account.md
      - 2. GitHub 화면 둘러보기: setup/2-screen.md
      - 3. 막혔을 때: setup/3-troubleshooting.md
  - 1교시 시작하기:
      - 교안: class1/index.md
      - 실습 1-1 내 첫 리포지토리 만들기: class1/lab-1.md
      - 실습 1-2 템플릿으로 연습 리포지토리 만들기: class1/lab-2.md
      - 실습 1-3 고치고 이력 보기: class1/lab-3.md
      - 혼자 해보기와 확인 퀴즈: class1/practice.md
  - 2교시 문서와 할 일:
      - 교안: class2/index.md
      - 실습 2-1 README 꾸미기: class2/lab-1.md
      - 실습 2-2 이슈 등록과 분류: class2/lab-2.md
      - 실습 2-3 이슈 템플릿 만들기: class2/lab-3.md
      - 실습 2-4 하위 이슈와 멘션: class2/lab-4.md
      - 혼자 해보기와 확인 퀴즈: class2/practice.md
  - 3교시 변경 관리:
      - 교안: class3/index.md
      - 실습 3-1 짝꿍 초대하기: class3/lab-1.md
      - 실습 3-2 분기 만들고 PR 열기: class3/lab-2.md
      - 실습 3-3 짝 리뷰와 병합: class3/lab-3.md
      - 실습 3-4 충돌 만들고 해결하기: class3/lab-4.md
      - 실습 3-5 Revert로 되돌리기: class3/lab-5.md
      - 혼자 해보기와 확인 퀴즈: class3/practice.md
  - 4교시 계획과 팀:
      - 교안: class4/index.md
      - 실습 4-1 Projects 보드 만들기: class4/lab-1.md
      - 실습 4-2 필드, 보드 뷰, 자동화: class4/lab-2.md
      - 실습 4-3 팀 구성과 그룹 리포지토리: class4/lab-3.md
      - 확인 퀴즈: class4/practice.md
  - 5교시 팀 실습 ①:
      - 교안과 역할 카드: class5/index.md
      - 미션 5-1 요구 주고받기: class5/mission-1.md
      - 미션 5-2 MVP 확정과 v1.0: class5/mission-2.md
      - 회고: class5/review.md
  - 6교시 팀 실습 ②:
      - 교안: class6/index.md
      - 미션 6-1 구현과 검토: class6/mission-1.md
      - 미션 6-2 변경 요청 처리: class6/mission-2.md
      - 미션 6-3 이력 감사: class6/mission-3.md
      - 회고: class6/review.md
  - 7교시 운영과 보안:
      - 교안: class7/index.md
      - 실습 7-1 터미널로 Git 다루기: class7/lab-1.md
      - 실습 7-3 2단계 인증 켜기: class7/lab-3.md
      - 오늘의 정리: class7/wrap-up.md
  - 부록:
      - Starter 파일 보기: appendix/starter-files.md
      - 용어집: appendix/glossary.md
      - 강사용 진행 메모: appendix/instructor.md

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["docs", "."]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
